<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Member Account — STACKLY FITNESS CLUB</title>
  <meta name="description" content="Register your Stackly Fitness Club member profile to begin booking classes, tracking progress, and communicating with coaches.">
  <meta property="og:title" content="Create Member Account — STACKLY FITNESS CLUB">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0B0D0C">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B0D0C'/%3E%3Cpath d='M4 16h6l3-8 6 16 3-8h6' stroke='%23C6FF00' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">

  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- AOS Animation Library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
</head>
<body>

  <!-- Minimal Header for Auth -->
  <header class="site-header" role="banner">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo" aria-label="STACKLY FITNESS CLUB">
        <img src="logo.webp" alt="STACKLY FITNESS CLUB" class="brand-logo-img">
      </a>

      <div class="nav-actions">
        <a href="index.html" class="btn btn-secondary btn-sm" aria-label="Back to Home">
          <i class="fa-solid fa-arrow-left"></i> <span>Back to Home</span>
        </a>
      </div>
    </div>
  </header>

  <main class="auth-page-wrap">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <div style="text-align: center; margin-bottom: 16px;">
          <a href="index.html" aria-label="Stackly Fitness Club">
            <img src="logo.webp" alt="STACKLY FITNESS CLUB" class="brand-logo-img" style="margin: 0 auto; height: 48px; max-width: 220px;">
          </a>
        </div>
        <span class="eyebrow" style="margin-bottom: 4px;">New Athlete Onboarding</span>
        <h1 class="auth-title">START YOUR SQUAD JOURNEY.</h1>
        <p style="font-size: 0.875rem; color: #A2A8A5;">Create your member credentials to activate your onboarding portal.</p>
      </div>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="signupRole">Account Role <span class="required">*</span></label>
          <select id="signupRole" class="form-control" required>
            <option value="" disabled selected>-- Select Role --</option>
            <option value="member">Member (Client)</option>
            <option value="admin">Administrator</option>
          </select>
          <div class="form-feedback"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupName">Full Legal Name <span class="required">*</span></label>
          <input type="text" id="signupName" class="form-control" placeholder="e.g. Alex Vance" required autocomplete="name">
          <div class="form-feedback"></div>
        </div>

        <div class="form-row-2col">
          <div class="form-group">
            <label class="form-label" for="signupEmail">Email Address <span class="required">*</span></label>
            <input type="email" id="signupEmail" class="form-control" placeholder="e.g. alex@example.com" required autocomplete="email">
            <div class="form-feedback"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signupPhone">Phone Number <span style="font-size: 0.75rem; color: #A8ADA5;">(Optional)</span></label>
            <input type="tel" id="signupPhone" class="form-control" placeholder="e.g. +91 98200 00000" autocomplete="tel">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupGoal">Membership / Performance Interest</label>
          <select id="signupGoal" class="form-control">
            <option value="hyrox" selected>HYROX & Athletic Conditioning</option>
            <option value="strength">Heavy Strength & Powerlifting</option>
            <option value="mobility">Longevity, Yoga & Bio-Recovery</option>
            <option value="combat">Boxing & Combat Striking</option>
            <option value="general">General Athletic Wellness</option>
          </select>
        </div>

        <div class="form-row-2col">
          <div class="form-group">
            <label class="form-label" for="signupPassword">Password <span class="required">*</span></label>
            <div class="password-field-wrapper">
              <input type="password" id="signupPassword" class="form-control" placeholder="Min. 8 chars" required autocomplete="new-password">
              <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="form-feedback"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signupConfirmPassword">Confirm <span class="required">*</span></label>
            <div class="password-field-wrapper">
              <input type="password" id="signupConfirmPassword" class="form-control" placeholder="Repeat" required autocomplete="new-password">
              <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="form-feedback"></div>
          </div>
        </div>

        <div class="form-check">
          <input type="checkbox" id="signupTerms" required checked>
          <label class="form-check-label" for="signupTerms">
            I accept the Stackly Club Rules, <a href="404.html" style="color: var(--color-accent); text-decoration: underline;">Safety Guidelines</a>, and <a href="404.html" style="color: var(--color-accent); text-decoration: underline;">Privacy Policy</a>.
          </label>
        </div>

        <div style="margin-top: 24px;">
          <button type="submit" class="btn btn-primary btn-lg btn-block">
            <span>Create Member Account</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </form>

      <div class="auth-footer">
        <span style="color: #8E9290;">Already have an account?</span>
        <a href="login.html" style="color: var(--color-accent); font-weight: 700; margin-left: 6px;">Sign In</a>
      </div>

      <div style="text-align: center; margin-top: 14px;">
        <a href="contact.html" style="font-size: 0.775rem; color: #A8ADA5; text-decoration: underline;">Forgot Password or Account Recovery?</a>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/forms.js"></script>
</body>
</html>
