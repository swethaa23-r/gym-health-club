<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Sign In — STACKLY FITNESS CLUB</title>
  <meta name="description" content="Sign in to your Stackly Fitness Club member dashboard to track workouts, manage class bookings, and view performance milestones.">
  <meta property="og:title" content="Member Sign In — STACKLY FITNESS CLUB">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0B0D0C">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B0D0C'/%3E%3Cpath d='M4 16h6l3-8 6 16 3-8h6' stroke='%23C6FF00' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">

  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- AOS Animation Library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
</head>
<body>

  <!-- Minimal Header for Auth -->
  <header class="site-header" role="banner">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo" aria-label="Stackly Fitness Club">
        <img src="logo.webp" alt="STACKLY FITNESS CLUB" class="brand-logo-img">
      </a>

      <div class="nav-actions">
        <a href="index.html" class="btn btn-secondary btn-sm">
          <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
      </div>
    </div>
  </header>

  <main class="auth-page-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <div style="text-align: center; margin-bottom: 16px;">
          <a href="index.html" aria-label="Stackly Fitness Club">
            <img src="logo.webp" alt="STACKLY FITNESS CLUB" class="brand-logo-img" style="margin: 0 auto; height: 48px; max-width: 220px;">
          </a>
        </div>
        <span class="eyebrow" style="margin-bottom: 4px;">Access Portal</span>
        <h1 class="auth-title">WELCOME BACK.</h1>
        <p style="font-size: 0.875rem; color: #A2A8A5;">Enter your credentials and select your role to proceed.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginRole">Account Role <span class="required">*</span></label>
          <select id="loginRole" class="form-control" required>
            <option value="" disabled selected>-- Select Role --</option>
            <option value="member">Member (Client)</option>
            <option value="admin">Administrator</option>
          </select>
          <div class="form-feedback"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginEmail">Full Name / Email <span class="required">*</span></label>
          <input type="text" id="loginEmail" class="form-control" placeholder="Enter your full name or email" required autocomplete="username">
          <div class="form-feedback"></div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
            <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password <span class="required">*</span></label>
            <a href="404.html" id="forgotPasswordBtn" style="font-size: 0.75rem; color: var(--color-accent); text-decoration: underline;">Forgot Password?</a>
          </div>
          <div class="password-field-wrapper">
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="form-feedback"></div>
        </div>

        <div class="form-check">
          <input type="checkbox" id="loginRemember" checked>
          <label class="form-check-label" for="loginRemember">Remember this device for 30 days</label>
        </div>

        <div style="margin-top: 24px;">
          <button type="submit" class="btn btn-primary btn-lg btn-block">
            <span>Sign In to Dashboard</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </form>

      <div class="auth-footer">
        <span style="color: #8E9290;">Don't have a membership yet?</span>
        <a href="signup.html" style="color: var(--color-accent); font-weight: 700; margin-left: 6px;">Sign Up Here</a>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/forms.js"></script>
</body>
</html>
